<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/research-home.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Jiashu Yu, home">Jiashu Yu</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="#about">About</a>
          <a href="#publications">Publications</a>
          <a href="mailto:{{ site.author.email }}">Email</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ site.time | date: '%Y' }} Jiashu Yu</span>
        <span>Designed for clarity, built with Jekyll.</span>
      </div>
    </footer>
  </body>
</html>
