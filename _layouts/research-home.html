<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9fc">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta name="robots" content="index, follow">
    <meta property="og:site_name" content="Jiashu Yu">
    {% if site.google_site_verification %}
    <meta name="google-site-verification" content="{{ site.google_site_verification }}">
    {% endif %}
    {% if site.bing_site_verification %}
    <meta name="msvalidate.01" content="{{ site.bing_site_verification }}">
    {% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/images/favicon-192x192.png' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | absolute_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | absolute_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Jiashu Yu",
        "alternateName": ["Jiashu Yu Homepage", "jiashu-yu.github.io"],
        "url": "{{ '/' | absolute_url }}"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/research-home.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© {{ site.time | date: '%Y' }} Jiashu Yu</span>
      </div>
    </footer>
  </body>
</html>
